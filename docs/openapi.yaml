openapi: 3.0.3
info:
  title: API de nómina Colombia
  version: 1.0.0
  description: API para autenticación y operaciones del sistema de nómina.
servers:
  - url: /
tags:
  - name: General
  - name: Autenticación
  - name: Empleados
  - name: Contratos
  - name: Asistencias
  - name: Administración
paths:
  /:
    get:
      tags: [General]
      summary: Estado de la API
      responses:
        "200":
          description: API disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API de nómina Colombia
  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar usuario
      description: Crea una cuenta; la contraseña se almacena como hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              correo: usuario@example.com
              password: una-clave-segura
      responses:
        "201":
          description: Usuario registrado.
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message:
                    type: string
                    example: Usuario registrado correctamente.
                  user:
                    $ref: "#/components/schemas/Usuario"
        "400":
          description: JSON inválido, correo no válido o contraseña fuera de rango.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El correo ya está registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Devuelve un JWT de acceso con vigencia de una hora.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              correo: usuario@example.com
              password: una-clave-segura
      responses:
        "200":
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaLogin"
        "400":
          description: Falta el correo o la contraseña, o el JSON es inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Credenciales inválidas o cuenta inactiva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar usuario autenticado
      description: Requiere un token JWT válido y no expirado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario asociado al token.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/Usuario"
        "401":
          description: Token ausente, inválido, expirado o usuario inactivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /empleados:
    get:
      tags: [Empleados]
      summary: Listar empleados de la empresa del usuario
      description: Requiere JWT y un usuario asociado a una empresa activa. Por defecto muestra hasta 20 registros.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: estado
          in: query
          schema:
            type: string
            enum: [ACTIVO, INACTIVO]
      responses:
        "200":
          description: Página de empleados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaEmpleados"
        "400":
          description: Parámetros de paginación o filtro inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no está asociado a una empresa activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Empleados]
      summary: Crear empleado
      description: La empresa se toma del usuario autenticado y no se acepta en el cuerpo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpleadoInput"
      responses:
        "201":
          description: Empleado creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleado"
        "400":
          description: Datos inválidos o campos obligatorios ausentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no está asociado a una empresa activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un empleado con el mismo documento en la empresa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /empleados/{empleado_id}:
    parameters:
      - name: empleado_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Empleados]
      summary: Obtener empleado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empleado encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleado"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no está asociado a una empresa activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Empleado no encontrado en la empresa del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Empleados]
      summary: Reemplazar datos del empleado
      description: Requiere los campos obligatorios. Los campos opcionales omitidos se limpian.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpleadoInput"
      responses:
        "200":
          description: Empleado actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleado"
        "400":
          description: Datos inválidos o campos obligatorios ausentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no está asociado a una empresa activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Empleado no encontrado en la empresa del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un empleado con el mismo documento en la empresa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Empleados]
      summary: Actualizar parcialmente un empleado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpleadoPatch"
      responses:
        "200":
          description: Empleado actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleado"
        "400":
          description: Datos inválidos o cuerpo vacío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no está asociado a una empresa activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Empleado no encontrado en la empresa del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un empleado con el mismo documento en la empresa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Empleados]
      summary: Desactivar empleado
      description: Eliminación lógica; conserva los datos e historial asociados.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empleado desactivado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaEmpleado"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no está asociado a una empresa activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Empleado no encontrado en la empresa del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
