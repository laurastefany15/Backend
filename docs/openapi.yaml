      allOf:
        - $ref: "#/components/schemas/IncapacidadInput"
        - type: object
          properties:
            tipo_documento:
              type: string
              enum: [CERTIFICADO_EPS, HISTORIA_CLINICA, TRANSCRIPCION, OTRO]
              default: OTRO
            documentos:
              type: array
              description: Archivos PDF, PNG o JPG de hasta 10 MB cada uno. Opcional.
              items:
                type: string
                format: binary
    DocumentosUpload:
      type: object
      required: [documentos]
      properties:
        tipo:
          type: string
          enum: [CERTIFICADO_EPS, HISTORIA_CLINICA, TRANSCRIPCION, OTRO]
          default: OTRO
        documentos:
          type: array
          description: Archivos PDF, PNG o JPG de hasta 10 MB cada uno.
          items:
            type: string
            format: binary
