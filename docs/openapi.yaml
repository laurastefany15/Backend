      type: object
      required: [contrato_id, tipo, fecha_inicio, fecha_fin]
      properties:
        contrato_id:
          type: integer
          minimum: 1
          example: 1
        tipo:
          type: string
          enum: [ENFERMEDAD_GENERAL, ACCIDENTE_LABORAL, ENFERMEDAD_LABORAL, MATERNIDAD, PATERNIDAD, OTRA]
          example: ENFERMEDAD_GENERAL
        fecha_inicio:
          type: string
          format: date
          example: "2026-04-01"
        fecha_fin:
          type: string
          format: date
          example: "2026-04-03"
        entidad_responsable:
          type: string
          maxLength: 150
          nullable: true
          description: Opcional. La incapacidad se puede registrar sin soporte de la EPS.
        numero_certificado:
          type: string
          maxLength: 100
          nullable: true
          description: Opcional. La incapacidad se puede registrar sin soporte de la EPS.
        porcentaje_reconocimiento:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          example: 66.67
        valor_estimado:
          type: number
          minimum: 0
          nullable: true
        valor_reconocido:
          type: number
          minimum: 0
          nullable: true
        estado:
          type: string
          enum: [REGISTRADA, VALIDADA, EN_COBRO, PAGADA, RECHAZADA]
          default: REGISTRADA
        observaciones:
          type: string
          nullable: true
