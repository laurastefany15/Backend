                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credenciales:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    Usuario:
      type: object
      required: [id, correo]
      properties:
        id:
          type: integer
          example: 1
        correo:
          type: string
          format: email
          example: usuario@example.com
    RespuestaLogin:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT firmado con HS256.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Vigencia del token en segundos.
          example: 3600
        user:
          $ref: "#/components/schemas/Usuario"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    EmpleadoInput:
      type: object
      required: [tipo_documento, numero_documento, nombres, apellidos]
      properties:
        tipo_documento:
          type: string
          maxLength: 10
          example: CC
        numero_documento:
          type: string
          maxLength: 30
          example: "123456789"
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        fecha_nacimiento:
          type: string
          format: date
          nullable: true
        telefono:
          type: string
          maxLength: 30
          nullable: true
        correo:
          type: string
          format: email
          maxLength: 150
          nullable: true
        direccion:
          type: string
          nullable: true
        contacto_emergencia:
          type: string
          maxLength: 150
          nullable: true
        telefono_emergencia:
          type: string
          maxLength: 30
          nullable: true
        banco:
          type: string
          maxLength: 120
          nullable: true
        tipo_cuenta:
          type: string
          maxLength: 25
          nullable: true
        numero_cuenta:
          type: string
          maxLength: 60
          nullable: true
        eps:
          type: string
          maxLength: 120
          nullable: true
        fondo_pension:
          type: string
          maxLength: 120
          nullable: true
        fondo_cesantias:
          type: string
          maxLength: 120
          nullable: true
        arl:
          type: string
          maxLength: 120
          nullable: true
        caja_compensacion:
          type: string
          maxLength: 120
          nullable: true
        estado:
          type: string
          enum: [ACTIVO, INACTIVO]
    EmpleadoPatch:
      type: object
      minProperties: 1
      properties:
        tipo_documento:
          $ref: "#/components/schemas/EmpleadoInput/properties/tipo_documento"
        numero_documento:
          $ref: "#/components/schemas/EmpleadoInput/properties/numero_documento"
        nombres:
          $ref: "#/components/schemas/EmpleadoInput/properties/nombres"
        apellidos:
          $ref: "#/components/schemas/EmpleadoInput/properties/apellidos"
        fecha_nacimiento:
          $ref: "#/components/schemas/EmpleadoInput/properties/fecha_nacimiento"
        telefono:
          $ref: "#/components/schemas/EmpleadoInput/properties/telefono"
        correo:
          $ref: "#/components/schemas/EmpleadoInput/properties/correo"
        direccion:
          $ref: "#/components/schemas/EmpleadoInput/properties/direccion"
        contacto_emergencia:
          $ref: "#/components/schemas/EmpleadoInput/properties/contacto_emergencia"
        telefono_emergencia:
          $ref: "#/components/schemas/EmpleadoInput/properties/telefono_emergencia"
        banco:
          $ref: "#/components/schemas/EmpleadoInput/properties/banco"
        tipo_cuenta:
          $ref: "#/components/schemas/EmpleadoInput/properties/tipo_cuenta"
        numero_cuenta:
          $ref: "#/components/schemas/EmpleadoInput/properties/numero_cuenta"
        eps:
          $ref: "#/components/schemas/EmpleadoInput/properties/eps"
        fondo_pension:
          $ref: "#/components/schemas/EmpleadoInput/properties/fondo_pension"
        fondo_cesantias:
          $ref: "#/components/schemas/EmpleadoInput/properties/fondo_cesantias"
        arl:
          $ref: "#/components/schemas/EmpleadoInput/properties/arl"
        caja_compensacion:
          $ref: "#/components/schemas/EmpleadoInput/properties/caja_compensacion"
        estado:
          $ref: "#/components/schemas/EmpleadoInput/properties/estado"
    RespuestaEmpleado:
      type: object
      required: [empleado]
      properties:
        message:
          type: string
        empleado:
          $ref: "#/components/schemas/Empleado"
    Empleado:
      allOf:
        - $ref: "#/components/schemas/EmpleadoInput"
        - type: object
          required: [id, empresa_id, creado_en]
          properties:
            id:
              type: integer
            empresa_id:
              type: integer
              readOnly: true
            creado_en:
              type: string
              format: date-time
              readOnly: true
    ListaEmpleados:
      type: object
