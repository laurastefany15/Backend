      allOf:
        - $ref: "#/components/schemas/IncapacidadInput"
        - type: object
          required: [id, documentos]
          properties:
            id:
              type: integer
              readOnly: true
            documentos:
              type: array
              readOnly: true
              items:
                $ref: "#/components/schemas/DocumentoIncapacidad"
