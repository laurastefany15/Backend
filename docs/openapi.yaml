  /admin/usuarios/{usuario_id}/empresa:
    parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Administración]
      summary: Consultar la empresa asociada a un usuario
      description: Requiere JWT y el rol ADMIN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Asociación consultada; empresa será null si no hay asociación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioEmpresa"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario autenticado no tiene el rol ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Administración]
      summary: Asociar una empresa a un usuario sin asociación previa
      description: Solo permite crear la asociación cuando el usuario aún no tiene empresa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsignacionEmpresa"
      responses:
        "201":
          description: Asociación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuarioEmpresa"
        "400":
          description: Cuerpo inválido o empresa_id no es un entero positivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario autenticado no tiene el rol ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Usuario o empresa no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El usuario ya tiene empresa, está inactivo o la empresa está inactiva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Administración]
      summary: Asignar o cambiar la empresa de un usuario
      description: Requiere JWT, rol ADMIN y una empresa activa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsignacionEmpresa"
      responses:
        "200":
          description: Asociación actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuarioEmpresa"
        "400":
          description: Cuerpo inválido o empresa_id no es un entero positivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario autenticado no tiene el rol ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Usuario o empresa no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El usuario está inactivo o la empresa está inactiva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Administración]
      summary: Desvincular empresa de un usuario
      description: Deja el campo usuarios.empresa_id en null. Requiere JWT y rol ADMIN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Asociación eliminada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuarioEmpresa"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario autenticado no tiene el rol ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Usuario no encontrado o sin empresa asociada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credenciales:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    Usuario:
      type: object
      required: [id, correo]
      properties:
        id:
          type: integer
          example: 1
        correo:
          type: string
          format: email
          example: usuario@example.com
    RespuestaLogin:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT firmado con HS256.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Vigencia del token en segundos.
          example: 3600
        user:
          $ref: "#/components/schemas/Usuario"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    EmpleadoInput:
      type: object
      required: [tipo_documento, numero_documento, nombres, apellidos]
      properties:
        tipo_documento:
          type: string
          maxLength: 10
          example: CC
        numero_documento:
          type: string
          maxLength: 30
          example: "123456789"
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        fecha_nacimiento:
          type: string
          format: date
          nullable: true
        telefono:
          type: string
          maxLength: 30
          nullable: true
        correo:
          type: string
          format: email
          maxLength: 150
          nullable: true
        direccion:
          type: string
          nullable: true
        contacto_emergencia:
          type: string
          maxLength: 150
          nullable: true
        telefono_emergencia:
          type: string
          maxLength: 30
          nullable: true
        banco:
          type: string
          maxLength: 120
          nullable: true
        tipo_cuenta:
          type: string
          maxLength: 25
          nullable: true
        numero_cuenta:
          type: string
          maxLength: 60
          nullable: true
        eps:
          type: string
          maxLength: 120
          nullable: true
        fondo_pension:
          type: string
          maxLength: 120
          nullable: true
        fondo_cesantias:
          type: string
          maxLength: 120
          nullable: true
        arl:
          type: string
          maxLength: 120
          nullable: true
        caja_compensacion:
          type: string
          maxLength: 120
          nullable: true
        estado:
          type: string
          enum: [ACTIVO, INACTIVO]
    EmpleadoPatch:
      type: object
      minProperties: 1
      properties:
        tipo_documento:
          $ref: "#/components/schemas/EmpleadoInput/properties/tipo_documento"
        numero_documento:
          $ref: "#/components/schemas/EmpleadoInput/properties/numero_documento"
        nombres:
          $ref: "#/components/schemas/EmpleadoInput/properties/nombres"
        apellidos:
          $ref: "#/components/schemas/EmpleadoInput/properties/apellidos"
        fecha_nacimiento:
          $ref: "#/components/schemas/EmpleadoInput/properties/fecha_nacimiento"
        telefono:
          $ref: "#/components/schemas/EmpleadoInput/properties/telefono"
        correo:
          $ref: "#/components/schemas/EmpleadoInput/properties/correo"
        direccion:
          $ref: "#/components/schemas/EmpleadoInput/properties/direccion"
        contacto_emergencia:
          $ref: "#/components/schemas/EmpleadoInput/properties/contacto_emergencia"
        telefono_emergencia:
          $ref: "#/components/schemas/EmpleadoInput/properties/telefono_emergencia"
        banco:
          $ref: "#/components/schemas/EmpleadoInput/properties/banco"
        tipo_cuenta:
          $ref: "#/components/schemas/EmpleadoInput/properties/tipo_cuenta"
        numero_cuenta:
          $ref: "#/components/schemas/EmpleadoInput/properties/numero_cuenta"
        eps:
          $ref: "#/components/schemas/EmpleadoInput/properties/eps"
        fondo_pension:
          $ref: "#/components/schemas/EmpleadoInput/properties/fondo_pension"
        fondo_cesantias:
          $ref: "#/components/schemas/EmpleadoInput/properties/fondo_cesantias"
        arl:
          $ref: "#/components/schemas/EmpleadoInput/properties/arl"
        caja_compensacion:
          $ref: "#/components/schemas/EmpleadoInput/properties/caja_compensacion"
        estado:
          $ref: "#/components/schemas/EmpleadoInput/properties/estado"
    RespuestaEmpleado:
      type: object
      required: [empleado]
      properties:
        message:
          type: string
        empleado:
          $ref: "#/components/schemas/Empleado"
    Empleado:
      allOf:
        - $ref: "#/components/schemas/EmpleadoInput"
        - type: object
          required: [id, empresa_id, creado_en]
          properties:
            id:
              type: integer
            empresa_id:
              type: integer
              readOnly: true
            creado_en:
              type: string
              format: date-time
              readOnly: true
    ListaEmpleados:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Empleado"
        pagination:
          type: object
          required: [page, per_page, total, pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            pages:
              type: integer
    AsignacionEmpresa:
      type: object
      required: [empresa_id]
      properties:
        empresa_id:
          type: integer
          minimum: 1
          example: 3
    UsuarioEmpresa:
      type: object
      required: [usuario, empresa]
      properties:
        usuario:
          type: object
          required: [id, correo]
          properties:
            id:
              type: integer
            correo:
              type: string
              format: email
        empresa:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EmpresaResumen"
    RespuestaUsuarioEmpresa:
      allOf:
        - $ref: "#/components/schemas/UsuarioEmpresa"
        - type: object
          properties:
            message:
              type: string
    AsistenciaInput:
      type: object
      required: [contrato_id, entrada]
      properties:
        contrato_id:
          type: integer
          minimum: 1
          example: 1
        entrada:
          type: string
          format: date-time
          example: "2026-03-02T08:00:00-05:00"
        salida:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-02T17:30:00-05:00"
        minutos_descanso:
          type: integer
          minimum: 0
          default: 0
          example: 60
        estado:
          type: string
          enum: [REGISTRADA, VALIDADA, ANULADA]
          default: REGISTRADA
        observacion:
          type: string
          nullable: true
    Asistencia:
      allOf:
        - $ref: "#/components/schemas/AsistenciaInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              readOnly: true
    ListaAsistencias:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asistencia"
        pagination:
          type: object
          required: [page, per_page, total, pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            pages:
              type: integer
    RespuestaAsistencia:
      type: object
      required: [message, asistencia]
      properties:
        message:
          type: string
        asistencia:
          $ref: "#/components/schemas/Asistencia"
    ContratoInput:
      type: object
      required:
        - empleado_id
        - tipo_contrato
        - cargo
        - fecha_inicio
        - salario_mensual
        - horas_semanales
      properties:
        empleado_id:
          type: integer
          minimum: 1
          example: 1
        tipo_contrato:
          type: string
          enum: [INDEFINIDO, FIJO, OBRA_LABOR, APRENDIZAJE, OTRO]
          example: INDEFINIDO
        cargo:
          type: string
          maxLength: 140
          example: Analista de nómina
        fecha_inicio:
          type: string
          format: date
          example: "2026-01-01"
        fecha_fin:
          type: string
          format: date
          nullable: true
        salario_mensual:
          type: number
          minimum: 0
          example: 2500000
        horas_semanales:
          type: number
          exclusiveMinimum: 0
          example: 48
        dia_descanso:
          type: integer
          minimum: 1
          maximum: 7
          default: 7
        tiene_auxilio_transporte:
          type: boolean
          default: true
        estado:
          type: string
          enum: [ACTIVO, TERMINADO]
          default: ACTIVO
    Contrato:
      allOf:
        - $ref: "#/components/schemas/ContratoInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              readOnly: true
    ListaContratos:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contrato"
        pagination:
          type: object
          required: [page, per_page, total, pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            pages:
              type: integer
    RespuestaContrato:
      type: object
      required: [message, contrato]
      properties:
        message:
          type: string
        contrato:
          $ref: "#/components/schemas/Contrato"
    EmpresaInput:
      type: object
      required: [nit, razon_social]
      properties:
        nit:
          type: string
          maxLength: 30
          example: "900123456-1"
        razon_social:
          type: string
          maxLength: 200
          example: Ejemplo S.A.S.
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          maxLength: 30
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        activa:
          type: boolean
          default: true
    Empresa:
      allOf:
        - $ref: "#/components/schemas/EmpresaInput"
        - type: object
          required: [id, nit, razon_social, activa]
          properties:
            id:
              type: integer
              readOnly: true
    ListaEmpresas:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Empresa"
        pagination:
          type: object
          required: [page, per_page, total, pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            pages:
              type: integer
    RespuestaEmpresa:
      type: object
      required: [message, empresa]
      properties:
        message:
          type: string
        empresa:
          $ref: "#/components/schemas/Empresa"
    EmpresaResumen:
      type: object
      required: [id, nit, razon_social, activa]
      properties:
        id:
          type: integer
        nit:
          type: string
        razon_social:
          type: string
        activa:
          type: boolean
